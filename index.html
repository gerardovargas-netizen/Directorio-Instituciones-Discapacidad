<!DOCTYPE html>
<html lang="es" data-palette="lightPalette" data-font="default">
<head>
  <meta charset="UTF-8">
  <base id="site-base">
  <script>
    (function () {
      var base = document.getElementById('site-base');
      var pageUrl = new URL(window.location.href);
      pageUrl.hash = '';
      pageUrl.search = '';

      if (/\.[a-z0-9]+$/i.test(pageUrl.pathname)) {
        pageUrl.pathname = pageUrl.pathname.slice(0, pageUrl.pathname.lastIndexOf('/') + 1);
      } else if (!pageUrl.pathname.endsWith('/')) {
        pageUrl.pathname += '/';
      }

      base.href = pageUrl.href;
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directorio de Instituciones de Apoyo a Personas con Discapacidad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="palettes.css">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1 class="site-header__title">Directorio de Instituciones de Apoyo a Personas con Discapacidad</h1>
  </header>

  <section id="options" aria-label="Options">
    <nav class="options-menu" aria-label="Options">
      <button
        type="button"
        id="paletteSwitch"
        class="options-menu__button options-menu__button--icon"
        aria-label="Cambiar a paleta oscura"
      ></button>
      <button
        type="button"
        id="fontSwitch"
        class="options-menu__button options-menu__button--icon"
        aria-label="Cambiar fuente"
      ></button>
    </nav>
  </section>

  <section id="cms" aria-label="CMS">
    <button
      type="button"
      id="cms-toggle"
      class="cms-form__toggle"
      aria-expanded="false"
      aria-controls="cms-form-panel"
    >
      Añadir nuevo registro
    </button>
    <div id="cms-form-panel" class="cms-form-panel">
      <div class="cms-form-panel__inner">
        <iframe
          class="cms-form__iframe"
          title="Información de Directorio DMRM"
          src="https://docs.google.com/forms/d/e/1FAIpQLScgo2hE0kW7emxhQSKrZGPhw9finEgiNKypyy9G2v8UpkCr2w/viewform?embedded=true"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
    </div>
  </section>

  <section id="directory" aria-label="Directory">
    <nav id="directory-filter" class="directory-filter" aria-label="Filtrar por letra"></nav>
    <div id="directory-tags-panel" class="directory-tags-panel" aria-hidden="true">
      <div class="directory-tags-panel__inner">
        <div id="directory-tags-list" class="directory-tags-list"></div>
      </div>
    </div>
    <div id="directory-tag-filter" class="directory-tag-filter" hidden></div>
    <div id="directory-list" class="directory-list"></div>
  </section>

  <div id="lightbox" class="lightbox" hidden aria-hidden="true">
    <div class="lightbox__backdrop"></div>
    <div class="lightbox__dialog" role="dialog" aria-modal="true" aria-labelledby="lightbox-title">
      <button type="button" class="lightbox__close" aria-label="Cerrar"></button>
      <div id="lightbox-content" class="lightbox__content"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="icons.js"></script>
  <script src="options.js"></script>
  <script src="cms.js"></script>
  <script src="directory.js"></script>
</body>
</html>
